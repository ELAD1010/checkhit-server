# /etc/apache2/sites-available/checkhit.conf

<VirtualHost *:80>
    ServerName app.checkhit.duckdns.org

    RewriteEngine On
    RewriteRule ^ https://app.checkhit.duckdns.org%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/checkhit-error.log
    CustomLog ${APACHE_LOG_DIR}/checkhit-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName app.checkhit.duckdns.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/app.checkhit.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app.checkhit.duckdns.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Must be at least as large as MAX_UPLOAD_BYTES.
    LimitRequestBody 26214400

    # Keep this before the generic "/" proxy.
    ProxyPass        /api/realtime/ws ws://127.0.0.1:3001/api/realtime/ws retry=0 timeout=3600
    ProxyPassReverse /api/realtime/ws ws://127.0.0.1:3001/api/realtime/ws

    ProxyPass        / http://127.0.0.1:3001/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/checkhit-error.log
    CustomLog ${APACHE_LOG_DIR}/checkhit-access.log combined
</VirtualHost>
