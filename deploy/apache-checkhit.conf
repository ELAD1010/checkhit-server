# /etc/apache2/sites-available/checkhit.conf
# Requires Apache 2.4.47+ for upgrade=websocket.
# Replace api.example.com, then run:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers
#   sudo a2ensite checkhit && sudo systemctl reload apache2
#   sudo certbot --apache -d api.example.com

<VirtualHost *:80>
    ServerName api.example.com

    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"
    ProxyPass        / http://127.0.0.1:3001/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
